<!DOCTYPE html>
<html>
<head>
    <title>Smart Soil Analyzer</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3a5a40, #588157, #a3b18a);
        }

        .card {
            width: 480px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        .sensor {
            background: rgba(255,255,255,0.3);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #2d6a4f;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        h2 {
            margin-bottom: 10px;
        }

        .status {
            font-size: 12px;
            margin-bottom: 10px;
        }

    </style>
</head>

<body>

<div class="card">

    <h2>🌾 Smart Soil Analyzer</h2>

    <div class="status" id="status">🔄 Connecting sensor...</div>

    <!-- SENSOR DISPLAY -->
    <div class="sensor">
        🌡 Temp: <span id="temp">0</span> °C |
        💧 Humidity: <span id="hum">0</span>% |
        🌱 Moisture: <span id="moist">0</span>%
    </div>

    <!-- FORM -->
    <form action="/predict" method="post">

        <!-- NPK -->
        <input type="number" name="N" placeholder="Nitrogen (N)" required>
        <input type="number" name="P" placeholder="Phosphorus (P)" required>
        <input type="number" name="K" placeholder="Potassium (K)" required>

        <!-- ENV -->
        <input type="number" step="0.1" name="ph" placeholder="pH Level" required>
        <input type="number" name="rainfall" placeholder="Rainfall (mm)" required>

        <!-- HIDDEN SENSOR VALUES -->
        <input type="hidden" name="temperature" id="t">
        <input type="hidden" name="humidity" id="h">
        <input type="hidden" name="soil_moisture" id="m">

        <button type="submit">🌱 Predict Crop</button>

    </form>

</div>

<script>

function updateSensor() {
    fetch("/get_sensor_data")
    .then(res => res.json())
    .then(data => {

        document.getElementById("temp").innerText = data.temperature.toFixed(1);
        document.getElementById("hum").innerText = data.humidity.toFixed(1);
        document.getElementById("moist").innerText = data.soil_moisture.toFixed(1);

        document.getElementById("t").value = data.temperature;
        document.getElementById("h").value = data.humidity;
        document.getElementById("m").value = data.soil_moisture;

        document.getElementById("status").innerText = "✅ Sensor Connected";
    })
    .catch(() => {
        document.getElementById("status").innerText = "❌ Sensor Not Connected";
    });
}

setInterval(updateSensor, 2000);
updateSensor();

</script>

</body>
</html>
