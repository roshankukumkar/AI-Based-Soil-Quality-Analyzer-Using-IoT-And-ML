<!DOCTYPE html>
<html>
<head>
    <title>Result</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3a5a40, #588157, #a3b18a);
        }

        .card {
            width: 500px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            text-align: center;
        }

        .crop {
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
        }

        .box {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2d6a4f;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>🌱 Crop Recommendation</h2>

    <div class="crop"> {{ crop }}</div>


    <hr>

    <div class="box">
        <p>🌾 N: {{ N }} | P: {{ P }} | K: {{ K }}</p>
    </div>

    <div class="box">
        <p>🧪 pH: {{ ph }} | 🌧 Rainfall: {{ rainfall }}</p>
    </div>

    <div class="box">
        <p>🌡 Temperature: {{ temperature if temperature else 0 }} °C</p>
        <p>💧 Humidity: {{ humidity if humidity else 0 }} %</p>
        <p>🌱 Soil Moisture: {{ soil_moisture if soil_moisture else 0 }} %</p>
    </div>

    <a href="/">
        <button>🔙 Back</button>
    </a>

</div>

</body>
</html>
